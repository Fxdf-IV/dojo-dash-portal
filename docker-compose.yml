version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dojo-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: dojo_dash
    volumes:
      - mongodb_data:/data/db
    networks:
      - dojo-network

volumes:
  mongodb_data:

networks:
  dojo-network:
    driver: bridge
